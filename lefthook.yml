# Git hooks. Installed by `pnpm install` (prepare script). CI is still the gate; hooks just catch things earlier.
pre-commit:
  commands:
    biome:
      glob: "*.{js,cjs,mjs,ts,tsx,json,jsonc,css}"
      run: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-push:
  commands:
    check:
      run: pnpm check
